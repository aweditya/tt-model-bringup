[project]
name = "tt-model-bringup"
version = "0.1.0"
description = "Tenstorrent Blackhole LLM bringup (Qwen3.6-family) — direct TT-Metal model bringup with custom owned_* compute kernels."
readme = "README.md"
requires-python = ">=3.10"

# TT-NN (ttnn) is installed separately via Tenstorrent's tt-metal source build.
# See README.md "Setup" section for the build flow; pin SHA TBD.
dependencies = [
    # Core ML stack — torch is CPU-only here; device tensors come from ttnn.
    "torch>=2.11.0",
    "numpy>=1.26.4,<2.0",

    # HuggingFace ecosystem.
    # huggingface_hub ships the `hf` binary that the README's
    # `uv run hf auth login` workflow depends on. Do NOT drop it.
    # (`huggingface-cli` is the deprecated alias for the same binary.)
    "huggingface-hub>=1.10.0",
    "transformers>=5.5.0",
    "safetensors>=0.7.0",
]

# uv-managed, no PyPI publishing.
# `[build-system]` intentionally omitted (uv init --no-package).

[dependency-groups]
# Dev tooling — `uv sync` installs these; CI + pre-commit use them.
dev = [
    "ruff>=0.14.0",
    "pre-commit>=4.0.0",
]

[tool.ruff]
line-length = 100
target-version = "py310"
# Lint only the curated, maintained tree. archive/ + pjrt_plugin/ are retired;
# experiments/utils/ is a probe dumping-ground pending archive triage (M3).
extend-exclude = ["archive", "scratch", "pjrt_plugin", "experiments/utils", "experiments/tt_jax"]

[tool.ruff.lint]
select = ["E", "F"]
ignore = [
    "E701", "E702", "E401",  # compact one-line statements — deliberate research style
    "E402",                  # late imports (after sys.path setup) are intentional here
    "E722",                  # bare except in probe/bench code
    "E731", "E741",          # lambda-assign / ambiguous single-char name — minor
    "E501",                  # line length is the formatter's job; long comments are fine
]
